name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {} # ручной запуск из вкладки Actions

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      # Сборка клиента в CI — на сервере не хватает RAM для vite build.
      - name: Build client
        working-directory: client
        run: |
          npm ci
          npm run build

      # Копируем готовый client/dist на сервер.
      - name: Copy dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: client/dist
          target: /opt/vst13
          # без rm: target=/opt/vst13, удаление снесло бы весь каталог приложения.
          # index.html и новые хешированные ассеты перезапишутся; старые ассеты
          # (с другим хешем) безвредны — при желании чистятся в deploy.sh.

      # Обновляем серверный код и перезапускаем сервис.
      - name: Run deploy script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # git pull делаем здесь, ДО запуска deploy.sh, иначе скрипт обновил бы
          # сам себя на середине исполнения (bash уже прочитал старую версию).
          # Перед reset сохраняем «живую» БД (data.db + WAL/SHM) и возвращаем после,
          # чтобы reset --hard не затёр серверные данные версией из репозитория.
          script: |
            cd /opt/vst13
            KEEP="$(mktemp -d)"
            cp server/data.db "$KEEP/" 2>/dev/null || true
            cp server/data.db-wal "$KEEP/" 2>/dev/null || true
            cp server/data.db-shm "$KEEP/" 2>/dev/null || true
            git fetch origin && git reset --hard origin/master
            cp "$KEEP/data.db" server/data.db 2>/dev/null || true
            cp "$KEEP/data.db-wal" server/data.db-wal 2>/dev/null || true
            cp "$KEEP/data.db-shm" server/data.db-shm 2>/dev/null || true
            rm -rf "$KEEP"
            bash scripts/deploy.sh
